<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Calculadora">
    <title>Calculadora</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="offline-indicator">Sin conexión</div>

    <!-- Pantalla: Calculadora -->
    <div id="screen-calc" class="screen screen--active">
        <div id="calc-header">
            <button id="btn-goto-divisas" aria-label="Ver cambio de divisas">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="1" x2="12" y2="23"/>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </button>
        </div>
        <div id="calc-display">
            <div id="display-value">0</div>
        </div>
        <div id="btn-grid"></div>
    </div>

    <!-- Pantalla: Divisas -->
    <div id="screen-divisas" class="screen">
        <div id="divisas-content"></div>
    </div>

    <!-- Update banner (global) -->
    <div id="update-banner">
        <div class="update-banner__body">
            <div class="update-banner__title">Nueva versión disponible</div>
            <div class="update-banner__sub">Toca "Actualizar" para instalar</div>
        </div>
        <div class="update-banner__actions">
            <button id="update-now-btn" class="update-btn update-btn--primary">Actualizar</button>
            <button id="dismiss-update-btn" class="update-btn update-btn--secondary">Luego</button>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/logic.js"></script>
    <script src="js/converter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
